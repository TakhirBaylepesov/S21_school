stages:
  - build
  - style
  - test
  - deploy

build_job:
  stage: build
  tags:
    - build
  script:
    - cd src && make
  artifacts:
    paths:
      - src/s21_cat
      - src/s21_grep
    expire_in: 30 days
  only:
    - develop
  after_script:
    - cd src/tlgbot.sh "build"

code_style:
  stage: style
  tags:
    - style
  script:
    - cd src
    - find . -name "*.c" -o -name "*.h" | xargs clang-format --style=file -i
    - git diff --exit-code
  only:
    - develop
  after_script:
    - cd src/tlgbot.sh "style"

test_job:
  stage: test
  tags:
    - test
  script:
    - chmod +x src/cat/tests_cat.sh
    - chmod +x src/grep/tests.sh
    - cd src/cat
    - bash tests_cat.sh
    - cd ../grep
    - bash tests.sh
  only:
    - develop
  after_script:
    - cd src/tlgbot.sh "test"

deploy_job:
  stage: deploy
  tags:
    - deploy
  script:
    - chmod +x deploy.sh
    - bash deploy.sh
  only:
    - develop
  after_script:
    - cd src/tlgbot.sh "deploy"
